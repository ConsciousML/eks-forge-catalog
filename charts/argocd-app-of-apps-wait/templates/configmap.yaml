apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-script
  namespace: {{ .Release.Namespace }}
data:
  wait.sh: |
    #!/bin/sh
    set -eu

    ns={{ .Release.Namespace | quote }}
    root={{ required "appName is required" .Values.appName | quote }}

    # The script fails before activeDeadlineSeconds. A pod killed at the deadline is deleted
    # with its logs.
    deadline=$(( $(date +%s) + {{ .Values.waitTimeout }} ))

    log_info() { echo "[INFO] $*" >&2; }

    fail() {
      echo "[ERROR] $1 not $2 after {{ .Values.waitTimeout }}s:" \
        "$(kubectl get application/"$1" -n "$ns" \
          -o jsonpath='sync={.status.sync.status} health={.status.health.status} {.status.health.message}')" >&2
      exit 1
    }

    remaining() { echo $(( deadline - $(date +%s) )); }

    # The controller removes the annotation once the refresh is done. The status read
    # afterwards is current, not the one from the last reconcile.
    refresh() {
      log_info "Refreshing $1"
      kubectl annotate application/"$1" -n "$ns" argocd.argoproj.io/refresh=normal --overwrite
      until [ -z "$(kubectl get application/"$1" -n "$ns" \
        -o jsonpath='{.metadata.annotations.argocd\.argoproj\.io/refresh}')" ]; do
        [ "$(remaining)" -gt 0 ] || fail "$1" Refreshed
        sleep 5
      done
    }

    # $1 is the app, $2 the field under .status, $3 the expected value.
    await() {
      log_info "Waiting for $1 to be $3"
      left=$(remaining)
      [ "$left" -gt 0 ] || fail "$1" "$3"
      kubectl wait application/"$1" -n "$ns" --timeout="${left}s" \
        --for=jsonpath="{.status.$2.status}=$3" || fail "$1" "$3"
    }

    synced() { await "$1" sync Synced; }
    healthy() { await "$1" health Healthy; }

    refresh "$root"
    synced "$root"
    for child in $(kubectl get application/"$root" -n "$ns" \
      -o jsonpath='{.status.resources[?(@.kind=="Application")].name}'); do
      refresh "$child"
      synced "$child"
      healthy "$child"
    done
    healthy "$root"
    log_info "Done, $root and its child Applications are Synced and Healthy"
